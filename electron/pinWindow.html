<!doctype html><html lang="id"><head><meta charset="utf-8"><title>PIN</title>
<style>
*{box-sizing:border-box;user-select:none}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:#4082AE;color:#181B23;display:flex;align-items:center;justify-content:center;height:100vh}
.card{background:#fff;border-radius:22px;padding:22px 24px;width:330px;text-align:center;border:2px solid #000}
h1{margin:0 0 4px;font-size:19px;font-style:italic;font-weight:800}p{margin:0 0 12px;font-size:13px;color:#55606E;min-height:18px}
.dots{display:flex;gap:10px;justify-content:center;margin:6px 0 10px;min-height:20px}.dots i{width:16px;height:16px;border-radius:50%;background:#181B23}
.err{color:#B81C34;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pad button{height:54px;font-size:22px;font-weight:700;border-radius:14px;border:2px solid #C7D0DA;background:#F4F6F8;cursor:pointer}
.pad button:active{background:#DDE3EA}.ok{background:#FDB533!important;border-color:#000!important}.no{background:#fff!important;font-size:15px!important}
</style></head><body><div class="card">
<h1 id="t">Masukkan PIN</h1><p id="m"></p><div class="dots" id="d"></div>
<div class="pad" id="pad"></div></div>
<script>
const MAX=8;let pin="",busy=false;const $=(i)=>document.getElementById(i);
const q=new URLSearchParams(location.search);$("t").textContent=q.get("title")||"Masukkan PIN";
function draw(){$("d").innerHTML=pin.split("").map(()=>"<i></i>").join("")}
function msg(t,e){$("m").textContent=t||"";$("m").className=e?"err":""}
async function go(){if(!pin||busy)return;busy=true;msg("Memeriksa…");const r=await window.popsnapPin.submit(pin);busy=false;if(!r.ok){pin="";draw();msg(r.error||"PIN salah.",true)}}
function press(k){if(busy)return;if(k==="ok")return go();if(k==="del"){pin=pin.slice(0,-1)}else if(k==="no"){return window.popsnapPin.cancel()}else if(pin.length<MAX){pin+=k}msg("");draw()}
const keys=["1","2","3","4","5","6","7","8","9","no","0","ok"];
$("pad").innerHTML=keys.map(k=>`<button data-k="${k}" class="${k==="ok"?"ok":k==="no"?"no":""}">${k==="ok"?"Buka":k==="no"?"Batal":k}</button>`).join("");
$("pad").addEventListener("click",(e)=>{const b=e.target.closest("button");if(b)press(b.dataset.k)});
addEventListener("keydown",(e)=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del");else if(e.key==="Enter")press("ok");else if(e.key==="Escape")press("no")});
draw();
</script></body></html>
